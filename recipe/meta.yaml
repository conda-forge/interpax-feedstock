{% set name = "interpax" %}
{% set version = "0.3.16" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/f0uriest/interpax/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b107df3e24479dcaad288874e1fa1054864bb016c0dc59bba35b6d2555f4dca0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - versioneer
  run:
    - jaxkd >=0.1.2,<0.2
    - jaxtyping >=0.2.24,<0.4
    - lineax >=0.0.5,<0.2
    - python >={{ python_min }}
    - equinox >=0.11.0,<0.14
    - jax >=0.5.0,<0.13
    - numpy >=1.20.0,<2.6

test:
  imports:
    - interpax
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/f0uriest/interpax
  summary: Interpolation and function approximation with JAX
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - beckermr
