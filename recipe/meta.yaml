{% set name = "interpax" %}
{% set version = "0.3.15" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/f0uriest/interpax/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f4273b8b4e656b1d5427535d484dd65ba5abe7aab81a5fb1a64de84ca82acb50

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - versioneer
  run:
    - jaxtyping >=0.2.24,<0.4
    - lineax >=0.0.5,<0.2
    - python >={{ python_min }}
    - equinox >=0.11.0,<0.14
    - jax >=0.5.0,<0.12
    - numpy >=1.20.0,<2.6

test:
  imports:
    - interpax
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/f0uriest/interpax
  summary: Interpolation and function approximation with JAX
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - beckermr
